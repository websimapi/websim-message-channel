<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Channel</title>
    <link rel="stylesheet" href="style.css">
    <!-- Add this line to ensure scripts can use postMessage API -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; child-src *; frame-src *">
</head>
<body>
    <div class="container">
        <h1>Message Channel</h1>
        
        <div class="message-section">
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Type your message here...">
                <button id="sendButton">Send</button>
            </div>
            
            <div class="message-log">
                <h2>Message Log</h2>
                <div id="messageHistory"></div>
            </div>
        </div>
        
        <div class="code-section">
            <h2>Integration Code</h2>
            <div class="code-block">
                <pre id="codeSnippet"></pre>
                <button id="copyButton">Copy to Clipboard</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
